name: Manual loop recovery regression tests
on:
  workflow_dispatch:
jobs:
  regressions:
    runs-on: macos-15
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/cache/restore@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: loop-recovery-${{ github.sha }}
          restore-keys: |
            macOS-dd-
      - run: python3 scripts/apply_zh_hans.py
      - name: Test duration policy
        run: swift test --package-path MedtrumLifecycleKit
      - name: Test reminder and loop request recovery
        if: success() || failure()
        run: |
          set -o pipefail
          xcodebuild test -workspace Trio.xcworkspace -scheme 'Trio Tests' \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -only-testing:TrioTests/NotLoopingMonitorTests -only-testing:TrioTests/LoopGuardRecoveryTests \
            -parallel-testing-enabled NO -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' 2>&1 | tee loop-recovery-tests.log
      - name: Test manual driver and defaults
        if: success() || failure()
        run: |
          set -o pipefail
          xcodebuild test -workspace Trio.xcworkspace -scheme MedtrumKitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -only-testing:MedtrumKitTests/ShortTempBasalTests -parallel-testing-enabled NO \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' 2>&1 | tee manual-default-tests.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: loop-recovery-regressions
          path: |
            loop-recovery-tests.log
            manual-default-tests.log
