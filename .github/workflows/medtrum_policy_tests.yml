name: Medtrum policy package tests
on:
  workflow_dispatch:
jobs:
  policy:
    runs-on: macos-26
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - uses: actions/checkout@v5
        with:
          sparse-checkout: MedtrumLifecycleKit
      - name: Test pure Medtrum lifecycle and short-session policies
        run: swift test --package-path MedtrumLifecycleKit
