name: Medtrum delivery recovery focused checks
on:
  workflow_dispatch:
jobs:
  recovery:
    runs-on: macos-26
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/cache/restore@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macOS-delivery-recovery-${{ github.sha }}
          restore-keys: |
            macOS-delivery-recovery-
            macOS-loop-recovery-release-
            macOS-dd-
      - run: python3 scripts/apply_zh_hans.py
      - name: Focused recovery tests
        run: |
          set -o pipefail
          xcodebuild test -workspace Trio.xcworkspace -scheme MedtrumKitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:MedtrumKitTests/DeliveryRecoveryTests \
            -only-testing:MedtrumKitTests/BaseResetDetectionTests \
            -only-testing:MedtrumKitTests/ShortTempBasalTests \
            -resultBundlePath "$RUNNER_TEMP/delivery-recovery.xcresult" \
            -parallel-testing-enabled NO -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' 2>&1 | tee delivery-recovery-tests.log
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/delivery-recovery.xcresult" > delivery-recovery-summary.json
          python3 -c 'import json; r=json.load(open("delivery-recovery-summary.json")); print(r); assert r["totalTestCount"] >= 24; assert r["failedTests"] == 0'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: delivery-recovery-focused-log
          path: |
            delivery-recovery-tests.log
            delivery-recovery-summary.json
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macOS-delivery-recovery-${{ github.sha }}
