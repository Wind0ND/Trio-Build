name: Manual basal driver regression tests
on:
  workflow_dispatch:
jobs:
  driver-tests:
    runs-on: macos-15
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Restore build dependencies
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: manual-basal-${{ github.sha }}
          restore-keys: |
            macOS-dd-
      - name: Test policy
        run: swift test --package-path MedtrumLifecycleKit
      - name: Test actual driver recovery paths
        run: |
          set -o pipefail
          xcodebuild test -workspace Trio.xcworkspace -scheme MedtrumKitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -only-testing:MedtrumKitTests/ShortTempBasalTests -parallel-testing-enabled NO \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' 2>&1 | tee short-basal-tests.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: short-basal-regression-log
          path: short-basal-tests.log
