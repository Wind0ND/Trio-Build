name: Native short policy checks
on:
  workflow_dispatch:
jobs:
  policy:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - run: |
          set -o pipefail
          swift test --package-path MedtrumLifecycleKit 2>&1 | tee native-policy.log
      - run: |
          set -o pipefail
          swift test --package-path AlgorithmPackage --filter BasalOnlyDosingModeTests 2>&1 | tee native-mode.log
        if: always()
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-short-policy-logs
          path: native-*.log
