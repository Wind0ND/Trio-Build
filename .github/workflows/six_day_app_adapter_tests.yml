name: Six-day pulse app adapter tests
on:
  push:
    branches: [feat/build39-six-day-pulse-20261128]
    paths:
      - Trio.xcodeproj/project.pbxproj
      - TrioTests/OpenAPSSwiftTests/BasalOnlyDosingModeTests.swift
      - .github/workflows/six_day_app_adapter_tests.yml
  workflow_dispatch:
jobs:
  app-adapter:
    runs-on: macos-26
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/cache/restore@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macOS-six-day-app-${{ github.sha }}
          restore-keys: |
            macOS-loop-recovery-release-941b8a0ea6bb30eb720d76e78afa269aadce6927
            macOS-loop-recovery-release-
      - run: python3 scripts/apply_zh_hans.py
      - name: Run registered app pump-adapter suite
        run: |
          set -o pipefail
          xcodebuild test -workspace Trio.xcworkspace -scheme 'Trio Tests' \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:TrioTests/BasalOnlyDosingModeTests \
            -resultBundlePath "$RUNNER_TEMP/six-day-app-adapter.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO -skipPackagePluginValidation -skipMacroValidation \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' 2>&1 | tee six-day-app-adapter.log
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/six-day-app-adapter.xcresult" > six-day-app-adapter-summary.json
          python3 -c 'import json; r=json.load(open("six-day-app-adapter-summary.json")); print(r); assert r["totalTestCount"] == 5; assert r["failedTests"] == 0; assert r["skippedTests"] == 0'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: six-day-app-adapter-log
          path: |
            six-day-app-adapter.log
            six-day-app-adapter-summary.json
