name: Build39 six-day pulse regression
on:
  push:
    branches: [feat/build39-six-day-pulse-20261128]
    paths-ignore: ['docs/**']
  workflow_dispatch:
jobs:
  mode:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Test shared session-age policy
        run: |
          set -o pipefail
          swift test --package-path MedtrumLifecycleKit 2>&1 | tee six-day-policy.log
      - name: Test effective dosing mode
        if: always()
        run: |
          set -o pipefail
          swift test --package-path AlgorithmPackage --filter BasalOnlyDosingModeTests 2>&1 | tee six-day-mode.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: six-day-mode-log
          path: six-day-*.log
  driver:
    runs-on: macos-26
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/cache/restore@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macOS-six-day-${{ github.sha }}
          restore-keys: |
            macOS-loop-recovery-release-
            macOS-dd-
      - run: python3 scripts/apply_zh_hans.py
      - name: Test lifetime, pulse boundaries and retained alarms
        run: |
          set -o pipefail
          xcodebuild test -workspace Trio.xcworkspace -scheme MedtrumKitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:MedtrumKitTests/ShortTempBasalTests \
            -only-testing:MedtrumKitTests/ExtendedLifeCapabilityTests \
            -resultBundlePath "$RUNNER_TEMP/six-day-driver.xcresult" \
            -parallel-testing-enabled NO -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' 2>&1 | tee six-day-driver.log
      - name: Summarize actual driver results
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/six-day-driver.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/six-day-driver.xcresult" > six-day-driver-summary.json
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: six-day-driver-log
          path: |
            six-day-driver.log
            six-day-driver-summary.json
